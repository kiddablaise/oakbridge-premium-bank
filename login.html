

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Oakbridge Financial Bank</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#071b35;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

.card{background:white;width:100%;max-width:430px;padding:35px;border-radius:16px}

h1{color:#071b35;margin-bottom:8px}

.brand{color:#b18b35;font-weight:bold;letter-spacing:2px}

p{color:#68758a;line-height:1.5}

label{display:block;margin-top:20px;margin-bottom:8px;font-size:14px}

input{width:100%;padding:14px;border:1px solid #dce1e8;border-radius:8px;font-size:16px}

button{width:100%;padding:15px;margin-top:25px;background:#b18b35;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold}

button:active{opacity:.8}

.notice{background:#fff6df;padding:14px;border-radius:8px;font-size:12px;margin-top:20px;color:#745719}

a{color:#9b7727;text-decoration:none}

</style>

</head>

<body>

<div class="card">

<div class="brand">OAKBRIDGE FINANCIAL BANK</div>

<h1>Welcome Back</h1>

<p>Enter any sample details to explore this fictional banking demonstration.</p>

<form id="demoLogin">

<label for="demoName">Demo username</label>

<input id="demoName" type="text" placeholder="Enter any sample name" required>

<label for="demoPassword">Demo password</label>

<input id="demoPassword" type="password" placeholder="Enter any sample text" required>

<button type="submit">Enter Demo Dashboard</button>

</form>

<div class="notice">

<strong>Demo only:</strong> Do not enter real banking usernames, passwords or financial information. This form does not authenticate users or store credentials.

</div>

<p><a href="index.html">← Back to Home</a></p>

</div>

<script>

document.getElementById("demoLogin").addEventListener("submit", function(event) {

event.preventDefault();

window.location.href = "dashboard.html";

});

</script>

</body>

</html>
